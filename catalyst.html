document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.05em;color:#fff;background:#E24072;padding:4px 8px;border-radius:5px;text-align:center;\">COPY MESSAGE<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1.7fr .8fr .9fr 1fr;gap:8px;padding:12px 14px;align-items:center;border-bottom:1px solid #f5f4f9;\"><span style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13px;color:#2A225E;\">Halcyon Industrial<\u002Fspan><span style=\"font-family:'Asap',sans-serif;font-weight:700;font-size:12.5px;color:#E24072;\">$88k<\u002Fspan><span style=\"font-family:'Asap',sans-serif;font-size:12px;color:#7a7a86;\">Reorder overdue<\u002Fspan><span style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.05em;color:#1B72B9;background:#e3f2fb;padding:4px 8px;border-radius:5px;text-align:center;\">CALL PREP<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1.7fr .8fr .9fr 1fr;gap:8px;padding:12px 14px;align-items:center;border-bottom:1px solid #f5f4f9;\"><span style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13px;color:#2A225E;\">Cascade Fluid Systems<\u002Fspan><span style=\"font-family:'Asap',sans-serif;font-weight:700;font-size:12.5px;color:#E24072;\">$61k<\u002Fspan><span style=\"font-family:'Asap',sans-serif;font-size:12px;color:#7a7a86;\">Open order stalled<\u002Fspan><span style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.05em;color:#1B72B9;background:#e3f2fb;padding:4px 8px;border-radius:5px;text-align:center;\">INVESTIGATE<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1.7fr .8fr .9fr 1fr;gap:8px;padding:12px 14px;align-items:center;\"><span style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13px;color:#2A225E;\">Meridian Packaging<\u002Fspan><span style=\"font-family:'Asap',sans-serif;font-weight:700;font-size:12.5px;color:#A0A0A5;\">$34k<\u002Fspan><span style=\"font-family:'Asap',sans-serif;font-size:12px;color:#7a7a86;\">Backorder<\u002Fspan><span style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.05em;color:#A0A0A5;background:#f0eef5;padding:4px 8px;border-radius:5px;text-align:center;\">REVIEW<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- VILLAIN STRIP -->\n      <div style=\"background:#0B0A1C;padding:46px 44px;color:#fff;\">\n        <div style=\"max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap;\">\n          <p style=\"font-family:'Asap',sans-serif;font-weight:500;font-size:20px;margin:0;max-width:520px;line-height:1.4;\">The whole market runs reactive because the data arrives <span style=\"color:#50D6FF;\">30–90 days too late.<\u002Fspan> By the time a number turns, the account has already moved on.<\u002Fp>\n          <div style=\"display:flex;gap:40px;\">\n            <div><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:30px;color:#50D6FF;\">8–20h<\u002Fdiv><div style=\"font-size:12px;color:rgba(255,255,255,.6);\">a week reps lose to spreadsheets<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:30px;color:#50D6FF;\">20→0.5<\u002Fdiv><div style=\"font-size:12px;color:rgba(255,255,255,.6);\">min to work a backorder<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- INSIGHT -->\n      <div style=\"background:#120F2A;padding:80px 44px;\">\n        <div style=\"max-width:900px;margin:0 auto;text-align:center;\">\n          <div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.18em;font-size:12px;color:#7DE7FF;text-transform:uppercase;margin-bottom:20px;\">Why one more report won't fix it<\u002Fdiv>\n          <p style=\"font-family:'Asap',sans-serif;font-weight:500;font-size:27px;line-height:1.45;color:#EDEBFA;margin:0;text-wrap:pretty;\">The market keeps handing reps one more piece to stitch together by hand. But the real problem is that the <span style=\"color:#50D6FF;\">entire path from raw data to executed action is manual and fragmented.<\u002Fspan> The fix isn't a better piece — it's collapsing the whole chain.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- LAST MILE band -->\n      <div id=\"how-it-works\" style=\"background:#161335;padding:76px 44px;\">\n        <div style=\"max-width:1080px;margin:0 auto;\">\n          <h3 style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:30px;color:#FFFFFF;text-align:center;margin:0 auto 8px;max-width:720px;\">Catalyst goes the last mile<\u002Fh3>\n          <p style=\"font-family:'Asap',sans-serif;font-size:16px;color:rgba(237,235,250,.68);text-align:center;max-width:640px;margin:0 auto 40px;\">Most tools stop at a dashboard or a recommendation. Catalyst prepares the intervention itself — your rep decides and acts.<\u002Fp>\n          <div style=\"display:flex;align-items:stretch;gap:8px;\">\n            <div style=\"flex:1;background:#1C1840;border-radius:10px;padding:20px 16px;text-align:center;\"><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:12px;color:rgba(237,235,250,.48);\">01<\u002Fdiv><div style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13.5px;color:#EDEBFA;margin-top:6px;\">Import<\u002Fdiv><div style=\"font-size:11px;color:rgba(237,235,250,.48);\">orders, inventory, pricing<\u002Fdiv><\u002Fdiv>\n            <div style=\"align-self:center;color:rgba(237,235,250,.38);\">→<\u002Fdiv>\n            <div style=\"flex:1;background:#1C1840;border-radius:10px;padding:20px 16px;text-align:center;\"><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:12px;color:rgba(237,235,250,.48);\">02<\u002Fdiv><div style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13.5px;color:#EDEBFA;margin-top:6px;\">Rank<\u002Fdiv><div style=\"font-size:11px;color:rgba(237,235,250,.48);\">every account by risk<\u002Fdiv><\u002Fdiv>\n            <div style=\"align-self:center;color:rgba(237,235,250,.38);\">→<\u002Fdiv>\n            <div style=\"flex:1;background:#1C1840;border-radius:10px;padding:20px 16px;text-align:center;\"><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:12px;color:rgba(237,235,250,.48);\">03<\u002Fdiv><div style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13.5px;color:#EDEBFA;margin-top:6px;\">Match<\u002Fdiv><div style=\"font-size:11px;color:rgba(237,235,250,.48);\">vetted substitutes<\u002Fdiv><\u002Fdiv>\n            <div style=\"align-self:center;color:rgba(237,235,250,.38);\">→<\u002Fdiv>\n            <div style=\"flex:1;background:#1C1840;border-radius:10px;padding:20px 16px;text-align:center;\"><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:12px;color:rgba(237,235,250,.48);\">04<\u002Fdiv><div style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13.5px;color:#EDEBFA;margin-top:6px;\">Prepare<\u002Fdiv><div style=\"font-size:11px;color:rgba(237,235,250,.48);\">the intervention<\u002Fdiv><\u002Fdiv>\n            <div style=\"align-self:center;color:#50D6FF;font-weight:700;\">➔<\u002Fdiv>\n            <div style=\"flex:1.2;background:linear-gradient(120deg,#1B72B9,#35A9E2);border-radius:10px;padding:20px 16px;text-align:center;box-shadow:0 12px 26px rgba(27,114,185,.3);\"><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:12px;color:rgba(255,255,255,.82);\">05 · HUMAN<\u002Fdiv><div style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:13.5px;color:#fff;margin-top:6px;\">Decide &amp; connect<\u002Fdiv><div style=\"font-size:11px;color:rgba(255,255,255,.75);\">the relationship<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- VALUE BENTO -->\n      <div id=\"why-catalyst\" style=\"background:#120F2A;padding:80px 44px;\">\n        <div style=\"max-width:1080px;margin:0 auto;\">\n          <div style=\"text-align:center;margin-bottom:40px;\"><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.16em;font-size:12px;color:#7DE7FF;text-transform:uppercase;\">What your team gets<\u002Fdiv><h3 style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:30px;color:#FFFFFF;margin:8px 0 0;\">Four ways it pays for itself<\u002Fh3><p style=\"font-family:'Asap',sans-serif;font-size:16px;line-height:1.6;color:rgba(237,235,250,.68);margin:12px auto 0;max-width:620px;\">Built for your AEs first — the people carrying hundreds of accounts. Then it extends to the rest of your B2B sales team, working from the same queue.<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(160px,auto);gap:16px;\">\n            <div style=\"grid-column:span 2;grid-row:span 2;background:linear-gradient(160deg,#2A225E,#191633);border-radius:14px;padding:32px;color:#fff;display:flex;flex-direction:column;\">\n              <div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.12em;font-size:11px;color:#7DE7FF;text-transform:uppercase;\">Theme 01 · Lead<\u002Fdiv>\n              <h4 style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:26px;margin:10px 0 12px;line-height:1.1;\">Catch revenue before it leaks<\u002Fh4>\n              <p style=\"font-family:'Asap',sans-serif;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.78);margin:0 0 auto;\">A consistent, comprehensive view of your whole book replaces gut feel and lagging reports — surfacing at-risk revenue while there's still time to save it.<\u002Fp>\n              <div style=\"margin-top:24px;display:flex;gap:6px;align-items:flex-end;height:60px;\">\n                <div style=\"flex:1;height:38%;background:rgba(125,231,255,.3);border-radius:3px;\"><\u002Fdiv><div style=\"flex:1;height:55%;background:rgba(125,231,255,.4);border-radius:3px;\"><\u002Fdiv><div style=\"flex:1;height:44%;background:rgba(125,231,255,.35);border-radius:3px;\"><\u002Fdiv><div style=\"flex:1;height:70%;background:#50D6FF;border-radius:3px;\"><\u002Fdiv><div style=\"flex:1;height:90%;background:#E24072;border-radius:3px;\"><\u002Fdiv><div style=\"flex:1;height:60%;background:rgba(125,231,255,.4);border-radius:3px;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"grid-column:span 2;background:rgba(255,255,255,.035);border-radius:14px;padding:28px;\">\n              <div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.1em;font-size:10.5px;color:#7DE7FF;text-transform:uppercase;\">Theme 02<\u002Fdiv>\n              <h4 style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:20px;color:#EDEBFA;margin:8px 0 8px;\">Give reps their time back<\u002Fh4>\n              <p style=\"font-family:'Asap',sans-serif;font-size:14px;line-height:1.55;color:rgba(237,235,250,.68);margin:0;\">Redirect draining, low-leverage work to the highest-leverage thing a rep does — the relationship. <i style=\"color:#EDEBFA;\">\"A day instead of a week.\"<\u002Fi><\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.035);border-radius:14px;padding:28px;\">\n              <div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.1em;font-size:10.5px;color:#7DE7FF;text-transform:uppercase;\">Theme 03<\u002Fdiv>\n              <h4 style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:18px;color:#EDEBFA;margin:8px 0 8px;\">Reps will actually use it<\u002Fh4>\n              <p style=\"font-family:'Asap',sans-serif;font-size:13.5px;line-height:1.55;color:rgba(237,235,250,.68);margin:0;\">Action-first, built for the non-analyst, usable on a phone.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,.035);border-radius:14px;padding:28px;\">\n              <div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.1em;font-size:10.5px;color:#7DE7FF;text-transform:uppercase;\">Theme 04<\u002Fdiv>\n              <h4 style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;font-size:18px;color:#EDEBFA;margin:8px 0 8px;\">Ramp in weeks<\u002Fh4>\n              <p style=\"font-family:'Asap',sans-serif;font-size:13.5px;line-height:1.55;color:rgba(237,235,250,.68);margin:0;\">Veteran judgment encoded in the interface. New reps productive on day one.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- PROOF horizontal -->\n      <div id=\"proof\" style=\"background:radial-gradient(50% 70% at 50% 0%,rgba(27,114,185,.18),rgba(18,15,42,0) 70%),#100D26;padding:76px 44px;\">\n        <div style=\"max-width:1000px;margin:0 auto;text-align:center;\">\n          <p style=\"font-family:'Libre Baskerville',Georgia,serif;font-style:italic;font-size:29px;line-height:1.5;color:#FFFFFF;margin:0 auto 20px;max-width:820px;\">\"I could do this in a day instead of a week — I'd be selling right now. If you're selling this to somebody at my company, I'd focus on that part. It's massive.\"<\u002Fp>\n          <div style=\"font-family:'Asap',sans-serif;font-size:14px;color:rgba(237,235,250,.68);\">— Top-performing account executive, medical-device manufacturer<\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;gap:52px;margin-top:44px;padding-top:36px;border-top:1px solid rgba(125,231,255,.12);flex-wrap:wrap;\">\n            <div><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:30px;color:#EDEBFA;\">8+ yrs<\u002Fdiv><div style=\"font-size:12px;color:rgba(237,235,250,.68);\">building sales data tools<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:30px;color:#EDEBFA;\">300+<\u002Fdiv><div style=\"font-size:12px;color:rgba(237,235,250,.68);\">projects · 75+ clients<\u002Fdiv><\u002Fdiv>\n            <div style=\"max-width:280px;text-align:left;font-family:'Asap',sans-serif;font-size:13px;color:rgba(237,235,250,.68);align-self:center;\">Founders from <b style=\"color:#EDEBFA;\">Google, Meta &amp; Amazon<\u002Fb>; degrees from Stanford, Caltech, Wharton, Harvard.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:32px;background:#1C1840;border-radius:12px;padding:26px 30px;border-left:3px solid #35A9E2;text-align:left;max-width:760px;margin-left:auto;margin-right:auto;\">\n            <p style=\"font-family:'Libre Baskerville',serif;font-style:italic;font-size:17px;color:#EDEBFA;margin:0 0 8px;line-height:1.5;\">\"Instead of waiting days or weeks for reports, I have the information at my fingertips to make live decisions on the fly.\"<\u002Fp>\n            <div style=\"font-family:'Asap',sans-serif;font-size:12.5px;color:rgba(237,235,250,.48);\">— CFO, financial-services client<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- CLOSE + CTA -->\n      <div style=\"background:radial-gradient(55% 80% at 50% 100%,rgba(80,214,255,.16),rgba(25,22,51,0) 70%),#0F0D24;padding:88px 44px;color:#fff;text-align:center;\">\n        <div style=\"max-width:800px;margin:0 auto;\">\n          <div style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.2em;font-size:12px;color:#7DE7FF;text-transform:uppercase;margin-bottom:18px;\">We use AI to grow human connection<\u002Fdiv>\n          <h3 style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:900;font-size:38px;line-height:1.08;margin:0 0 16px;\">AI does the grunt work. Your reps build the relationships.<\u002Fh3>\n          <p style=\"font-family:'Asap',sans-serif;font-size:17px;color:rgba(255,255,255,.78);margin:0 0 34px;\">Put it on your data in about a week. Catalyst reads from the systems you already have — read-only, no rip-and-replace, nothing sent without your rep. Start with your AEs, prove it on a slice of your own data, then roll it out to the rest of your sales team.<\u002Fp>\n          <a href=\"{{ ctaUrl }}\" target=\"_blank\" style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:17px;color:#191633;background:#50D6FF;padding:17px 34px;border-radius:9px;display:inline-block;\">Book your working session<\u002Fa>\n          <sc-if value=\"{{ showLeakyBucket }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:48px;padding-top:34px;border-top:1px solid rgba(255,255,255,.14);max-width:540px;margin-left:auto;margin-right:auto;\">\n              <div style=\"font-family:'Asap',sans-serif;font-size:15px;color:rgba(255,255,255,.82);font-weight:600;margin-bottom:4px;\">Not ready to talk? Get the Leaky Bucket Audit.<\u002Fdiv>\n              <p style=\"font-size:13px;color:rgba(255,255,255,.58);margin:0 0 16px;\">Five signals an account is about to churn — and what top reps do in the first 48 hours.<\u002Fp>\n              <sc-if value=\"{{ submittedB }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family:'Asap',sans-serif;font-size:14px;color:#7DE7FF;\">Thanks — the audit is on its way to your inbox.<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ notSubmittedB }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;gap:8px;justify-content:center;\">\n                  <input value=\"{{ emailB }}\" sc-camel-on-change=\"{{ onEmailB }}\" placeholder=\"you@company.com\" style=\"font-family:'Asap',sans-serif;font-size:14px;padding:12px 14px;border-radius:7px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;width:250px;\">\n                  <button sc-camel-on-click=\"{{ submitB }}\" style=\"font-family:'Asap',sans-serif;font-weight:600;font-size:14px;color:#191633;background:#fff;border:none;padding:12px 20px;border-radius:7px;cursor:pointer;\">Send it<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#12101f;padding:30px 44px;display:flex;justify-content:space-between;align-items:center;\">\n        <div style=\"display:flex;align-items:center;gap:10px;\"><img src=\"83efe0e6-ddea-41de-bb79-bc61be0fa47f\" style=\"height:22px;\" alt=\"Stratus Data\"><span style=\"font-family:'Brandon Grotesque',sans-serif;font-weight:700;letter-spacing:.24em;font-size:11px;color:rgba(255,255,255,.85);\">STRATUS DATA<\u002Fspan><\u002Fdiv>\n        <div style=\"font-family:'Asap',sans-serif;font-size:12px;color:rgba(255,255,255,.45);\">© 2026 Stratus Data<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;ctaUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://calendly.com/stratus-charles/30&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;showLeakyBucket&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { emailA:'', emailB:'', emailC:'', submittedA:false, submittedB:false, submittedC:false };\n  renderVals(){\n    const url = this.props.ctaUrl || 'https://calendly.com/stratus-charles/30';\n    const showLB = this.props.showLeakyBucket ?? true;\n    return {\n      ctaUrl: url,\n      showLeakyBucket: showLB,\n      emailA:this.state.emailA, emailB:this.state.emailB, emailC:this.state.emailC,\n      submittedA:this.state.submittedA, submittedB:this.state.submittedB, submittedC:this.state.submittedC,\n      notSubmittedA:!this.state.submittedA, notSubmittedB:!this.state.submittedB, notSubmittedC:!this.state.submittedC,\n      onEmailA:e=>this.setState({emailA:e.target.value}),\n      onEmailB:e=>this.setState({emailB:e.target.value}),\n      onEmailC:e=>this.setState({emailC:e.target.value}),\n      submitA:()=>this.setState({submittedA:true}),\n      submitB:()=>this.setState({submittedB:true}),\n      submitC:()=>this.setState({submittedC:true}),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
